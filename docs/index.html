<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FRC Inserter</title>
    <style>
      :root {
        color-scheme: light;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --ok: #047857;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        background: #fff;
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      .status {
        color: var(--muted);
      }
      .status.ok {
        color: var(--ok);
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: currentColor;
        vertical-align: 1px;
      }
      h2 {
        margin: 16px 0 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      li {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
      }
      details {
        margin-top: 16px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
      }
      pre {
        margin: 8px 0 0;
        max-height: 320px;
        overflow: auto;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>FRC Inserter</h1>
    <div id="status" class="status"></div>

    <h2 id="count"></h2>
    <ul id="selection"></ul>

    <p>Select two parallel faces or circular edges, then press the hotkey (Alt+I by default).</p>

    <details>
      <summary>Messages from Onshape</summary>
      <pre id="raw"></pre>
    </details>

    <script src="panel.js"></script>
  </body>
</html>
